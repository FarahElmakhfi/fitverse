<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription - TRY-ON</title>
  <link rel="stylesheet" href="./inscription.css" />
</head>
<script src="./inscription.js"></script>

<body>
  <div class="background-blur"></div>

  <header class="navbar">
    <h1 class="logo">TRY-<span>ON</span></h1>
    <nav>
      <a href="../public/index.html">Accueil</a>
      <a href="../connexion/connexion.html">Connexion</a>
    </nav>
  </header>

  <section class="register-section">
    <div class="glass-card register-box">
      <h2>Créer un compte</h2>
      <form id="registerForm">
        <label for="name">Nom complet</label>
        <input type="text" id="name" placeholder="Sara" required />

        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="Sara@mail.com" required />

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="123456" required />

        <label for="confirm">Confirmer le mot de passe</label>
        <input type="password" id="confirm" placeholder="123456" required />

        <button type="submit" class="btn-neon">S'inscrire</button>
      </form>

      <div class="back-link">
        <a href="../connexion/connexion.html">← Retour à la connexion</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    &copy; 2025 TRY-ON. Tous droits réservés.
  </footer>

  <!-- ✅ Script pour envoyer les données vers le backend -->
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        alert("Les mots de passe ne correspondent pas.");
        return;
      }

      const response = await fetch('http://localhost:5000/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role: "consultant" }) // ou "user"
      });

      const data = await response.json();

      if (response.ok) {
        alert("Inscription réussie !");
        localStorage.setItem('token', data.user.token);
        window.location.href = "../connexion/connexion.html";
      } else {
        alert(data.message || "Erreur lors de l'inscription");
      }
    });
  </script>
</body>
<script src="./inscription.js"></script>

</html>
