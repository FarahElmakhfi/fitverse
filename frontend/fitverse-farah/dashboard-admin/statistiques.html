<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Statistiques - TRY-ON</title>
  <link rel="stylesheet" href="../dashboard-admin/dashboard-admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="navbar">
    <h1 class="logo">TRY-<span>ON</span></h1>
    <nav>
      <a href="../dashboard-admin/dashboard-admin.html">Dashboard</a>
      <a href="../connexion/connexion.html">Déconnexion</a>
    </nav>
  </header>

  <section class="dashboard-section">
    <h2 class="welcome">📊 Statistiques</h2>
    <canvas id="statsChart" width="600" height="400"></canvas>
  </section>

  <footer class="footer">
    &copy; 2025 TRY-ON. Tous droits réservés.
  </footer>

  <script>
    const ctx = document.getElementById('statsChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Produits', 'Utilisateurs', 'Commandes'],
        datasets: [{
          label: 'Nombre',
          data: [12, 8, 15],
          backgroundColor: ['#9f00ff', '#ff4444', '#00d1b2']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            display: false
          }
        }
      }
    });
  </script>
</body>
</html>
