<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gérer les Produits - TRY-ON</title>
  <link rel="stylesheet" href="../dashboard-admin/dashboard-admin.css" />
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 2rem;
      background-color: rgba(255,255,255,0.05);
      color: white;
    }
    th, td {
      padding: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      text-align: center;
    }
    th {
      background-color: #9f00ff;
    }
    .add-form {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .add-form input {
      padding: 0.5rem;
      border-radius: 5px;
      border: none;
    }
    .add-button {
      background-color: #9f00ff;
      color: white;
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .add-button:hover {
      box-shadow: 0 0 10px #9f00ff;
    }
    button.action {
      margin: 0 5px;
      padding: 5px 10px;
      cursor: pointer;
    }
    input.inline-edit {
      background: transparent;
      border: 1px solid #fff;
      color: #fff;
      text-align: center;
      padding: 5px;
      border-radius: 5px;
      width: 90%;
    }
  </style>
</head>
<body>
  <header class="navbar">
    <h1 class="logo">TRY-<span>ON</span></h1>
    <nav>
      <a href="../dashboard-admin/dashboard-admin.html">Dashboard</a>
      <a href="../connexion/connexion.html">Déconnexion</a>
    </nav>
  </header>

  <section class="dashboard-section">
    <h2 class="welcome">📦 Gérer les Produits</h2>

    <form class="add-form" id="productForm">
      <input type="text" id="productName" placeholder="Nom du produit" required />
      <input type="number" id="productPrice" placeholder="Prix (MAD)" required />
      <input type="url" id="productImage" placeholder="URL de l'image" required />
      <button type="submit" class="add-button">➕ Ajouter</button>
    </form>

    <table id="productTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nom</th>
          <th>Prix</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <footer class="footer">
    &copy; 2025 TRY-ON. Tous droits réservés.
  </footer>

  <script>
    async function fetchProducts() {
      const res = await fetch("http://localhost:5000/api/products");
      const data = await res.json();
      const tbody = document.querySelector("#productTable tbody");
      tbody.innerHTML = "";
      data.forEach(product => {
        tbody.innerHTML += `
          <tr>
            <td>#${product._id}</td>
            <td>${product.name}</td>
            <td>${product.price} MAD</td>
            <td><img src="${product.image}" width="60" /></td>
            <td>
              <button class="action" onclick="editProduct('${product._id}', this)">Modifier</button>
              <button class="action" onclick="deleteProduct('${product._id}')">Supprimer</button>
            </td>
          </tr>
        `;
      });
    }

    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const name = document.getElementById('productName').value.trim();
      const price = document.getElementById('productPrice').value.trim();
      const image = document.getElementById('productImage').value.trim();
      if (!name || !price || !image) return alert("Veuillez remplir tous les champs.");

      await fetch("http://localhost:5000/api/products", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price, image })
      });

      this.reset();
      fetchProducts();
    });

    async function deleteProduct(id) {
      if (confirm("Supprimer ce produit ?")) {
        await fetch(`http://localhost:5000/api/products/${id}`, { method: "DELETE" });
        fetchProducts();
      }
    }

    async function editProduct(id, btn) {
      const row = btn.closest("tr");
      const nameCell = row.children[1];
      const priceCell = row.children[2];
      const imageCell = row.children[3];

      if (btn.textContent === "Modifier") {
        const name = nameCell.textContent;
        const price = priceCell.textContent.replace(" MAD", "");
        const image = imageCell.querySelector("img").src;

        nameCell.innerHTML = `<input class='inline-edit' value='${name}'>`;
        priceCell.innerHTML = `<input class='inline-edit' value='${price}'>`;
        imageCell.innerHTML = `<input class='inline-edit' value='${image}'>`;
        btn.textContent = "Enregistrer";
      } else {
        const updated = {
          name: nameCell.querySelector("input").value,
          price: priceCell.querySelector("input").value,
          image: imageCell.querySelector("input").value
        };

        await fetch(`http://localhost:5000/api/products/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(updated)
        });

        btn.textContent = "Modifier";
        fetchProducts();
      }
    }

    fetchProducts();
  </script>
</body>
</html>
