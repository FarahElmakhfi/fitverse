<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion - TRY-ON</title>
  <link rel="stylesheet" href="./connexion.css" />
</head>
<body>
  <div class="background-blur"></div>

  <header class="navbar">
    <h1 class="logo">TRY-<span>ON</span></h1>
    <nav>
      <a href="../public/index.html">Accueil</a>
      <a href="../inscription/inscription.html">Inscription</a>
    </nav>
  </header>

  <section class="login-section">
    <div class="glass-card login-box">
      <h2>Connexion</h2>

      <!-- ✅ Sélecteur de rôle -->
      <div class="role-selection" style="text-align:center; margin-bottom: 1rem;">
        <button id="userBtn" type="button" class="btn-green">Utilisateur</button>
        <button id="adminBtn" type="button" class="btn-pink">Admin</button>
      </div>

      <form id="loginForm">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="exemple@mail.com" required />

        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required />

        <div class="form-footer">
          <a href="../mdp/mdp.html" class="forgot-link">Mot de passe oublié ?</a>
          <button type="submit" class="btn-neon">Se connecter</button>
        </div>
      </form>

      <div class="back-link">
        <a href="../public/index.html">← Retour à l’accueil</a>
      </div>
      <div class="account-link">
        <p>Pas de compte ? <a href="../inscription/inscription.html">Inscris-toi</a></p>
      </div>
    </div> 
  </section> 

  <footer class="footer">
    &copy; 2025 TRY-ON. Tous droits réservés.
  </footer>

  <!-- ✅ Script -->
  <script src="./connexion.js"></script>
</body>
</html>
