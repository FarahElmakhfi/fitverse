<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Paiement | TRY-ON</title>
  <link rel="stylesheet" href="paiement.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>
  <div class="twinkling"></div>

  <div class="paiement-glass">
    <h1>Activer mon style</h1>

    <form class="glass-form">
      <div class="input-group">
        <input type="text" required placeholder="Nom complet">
      </div>
      <div class="input-group">
        <input type="text" required placeholder="Numéro de carte">
      </div>
      <div class="flex-row">
        <div class="input-group input-half">
          <input type="text" required placeholder="MM/AA">
        </div>
        <div class="input-group input-half">
          <input type="text" required placeholder="CVC">
        </div>
      </div>

      <button type="submit" class="neon-btn"> Activer</button>
    </form>

    <a href="../index.html" class="back-home">← Retour</a>
  </div>
</body>
</html>
