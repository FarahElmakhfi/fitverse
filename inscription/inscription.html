<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription - TRY-ON</title>
  <link rel="stylesheet" href="./inscription.css" />
</head>
<body>
  <div class="background-blur"></div>

  <header class="navbar">
    <h1 class="logo">TRY-<span>ON</span></h1>
    <nav>
      <a href="../public/index.html">Accueil</a>
      <a href="../connexion/connexion.html">Connexion</a>
    </nav>
  </header>

  <section class="register-section">
    <div class="glass-card register-box">
      <h2>Créer un compte</h2>
      <form>
        <label for="name">Nom complet</label>
        <input type="text" id="name" placeholder="Votre nom" required />
  
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" placeholder="exemple@mail.com" required />
  
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required />
  
        <label for="confirm">Confirmer le mot de passe</label>
        <input type="password" id="confirm" placeholder="••••••••" required />
  
        <button type="submit" class="btn-neon">S'inscrire</button>
      </form>
  
     
      <div class="back-link">
        <a href="../connexion/connexion.html">← Retour à la connexion</a>
      </div>
    </div>
  
  </section>
  
  <footer class="footer">
    &copy; 2025 TRY-ON. Tous droits réservés.
  </footer>
</body>
</html>
